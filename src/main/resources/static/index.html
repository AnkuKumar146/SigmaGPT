<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SigmaGPT</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #343541; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #chat-box { width: 100%; max-width: 700px; height: 500px; border: 1px solid #4d4d4f; border-radius: 8px; padding: 15px; overflow-y: auto; background-color: #444654; margin-bottom: 20px; }
        .message { margin-bottom: 15px; padding: 10px; border-radius: 5px; line-height: 1.5; white-space: pre-wrap; }
        .user { background-color: #10a37f; text-align: right; }
        .ai { background-color: #3e3f4b; text-align: left; }
        #input-container { display: flex; width: 100%; max-width: 730px; }
        input { flex: 1; padding: 12px; border: 1px solid #4d4d4f; border-radius: 5px; background-color: #40414f; color: white; font-size: 16px; }
        button { padding: 12px 20px; border: none; background-color: #10a37f; color: white; border-radius: 5px; margin-left: 10px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1a7f64; }
    </style>
</head>
<body>

    <h2>SigmaGPT Chat</h2>
    <div id="chat-box"></div>

    <div id="input-container">
        <input type="text" id="userInput" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Page load hote hi DB se purani Chat History load karega
        window.onload = function() {
            fetch('/history')
                .then(res => res.json())
                .then(data => {
                    data.forEach(chat => {
                        appendMessage(chat.userMessage, 'user');
                        appendMessage(chat.aiResponse, 'ai');
                    });
                })
                .catch(err => console.error("Error loading history:", err));
        };

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage(message, 'user');
            input.value = '';

            fetch('/chat?message=' + encodeURIComponent(message))
                .then(res => res.text())
                .then(reply => {
                    appendMessage(reply, 'ai');
                })
                .catch(err => {
                    appendMessage("Error: " + err, 'ai');
                });
        }

        function appendMessage(text, sender) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + sender;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
